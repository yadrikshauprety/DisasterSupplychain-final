          {sel && (
            <div style={{padding:"12px 14px",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:2,marginBottom:16}}>
              <div style={{fontSize:10,color:"var(--muted)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:10}}>Load Test ETH (Optional)</div>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                <input
                  type="number"
                  value={loadAmt}
                  onChange={e=>setLoadAmt(e.target.value)}
                  placeholder="0.00"
                  min="0"
                  step="10"
                  style={{flex:1,fontSize:15,fontWeight:700,color:"var(--amber)"}}
                />
                <span style={{fontSize:12,color:"var(--muted)",flexShrink:0}}>ETH</span>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {[10,50,100,500].map(amt=>(
                  <button key={amt} className="btn btn-ghost" style={{padding:"4px 12px",fontSize:11}}
                    onClick={()=>setLoadAmt(String(amt))}>
                    +{amt}
                  </button>
                ))}
              </div>
              <div style={{fontSize:10,color:"var(--muted)",marginTop:8,lineHeight:1.6}}>
                Current: <strong style={{color:"var(--text)"}}>{sel.eth} ETH</strong>
                {loadAmt && parseFloat(loadAmt)>0 && (
                  <> → After load: <strong style={{color:"var(--green-lt)"}}>{(sel.eth+parseFloat(loadAmt)).toFixed(2)} ETH</strong></>
                )}
              </div>
            </div>
          )}

          <button className="btn btn-primary btn-full" onClick={confirm} disabled={!sel||loading}>
            {loading ? "Connecting wallet…" : sel ? `Connect ${sel.label.split("—")[1]?.trim()||"Account"}` : "Select an account"}
          </button>
          <button className="btn btn-ghost btn-full" style={{marginTop:8,fontSize:11}} onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════
function Login({ onLogin }) {
  const [email, setEmail]         = useState("");
  const [pw, setPw]               = useState("");
  const [err, setErr]             = useState("");
  const [loading, setLoad]        = useState(false);
  const [showWallet, setShowWallet] = useState(false);
  const [pendingUser, setPending]   = useState(null);

  const go = async () => {
    setErr(""); setLoad(true);
    await new Promise(r=>setTimeout(r,600));
    const u = DB.user(email.trim(), pw);
    if (!u) { setErr("Invalid credentials — use one of the demo accounts below"); setLoad(false); return; }
    if (u.role === "donor") {
      // Show wallet selector popup for donors
      setPending(u);
      setShowWallet(true);
      setLoad(false);
    } else {
      onLogin({...u});
    }
  };

  const onWalletSelect = (userWithWallet) => {
    setShowWallet(false);
    setPending(null);
    onLogin(userWithWallet);
  };

  const demos = [
    { label:"Donor",         email:"arjun@donor.com",     pw:"donor123",  role:"donor" },
    { label:"NGO",           email:"ngo@relief.org",      pw:"ngo123",    role:"ngo" },
    { label:"Logistics",     email:"swift@logistics.com", pw:"swift123",  role:"logistics" },
    { label:"Aid Recipient", email:"priya@relief.org",    pw:"relief123", role:"recipient" },
  ];

  return (
    <div className="login-wrap">
      {showWallet && (
        <WalletSelector
          onSelect={onWalletSelect}
          onClose={()=>{ setShowWallet(false); setPending(null); }}
        />
      )}
      <div className="login-card">
        <div className="login-header">
          <div className="login-wordmark">DisasterChain</div>
          <div className="login-tagline">Humanitarian Aid · Blockchain Transparency</div>
        </div>
        <div className="login-panel">
          <div className="login-title">Sign in</div>
          {err && <div className="error-msg">{err}</div>}
          <div className="form-group"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="you@example.com"/></div>
          <div className="form-group"><label>Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••"/></div>
          <button className="btn btn-primary btn-full" onClick={go} disabled={loading} style={{marginTop:4}}>
            {loading ? "Connecting…" : "→  Sign in"}
          </button>

          <div style={{marginTop:24}}>
            <div style={{fontSize:10,color:'var(--muted)',letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:10}}>Demo accounts</div>
            <div className="demo-grid">
              {demos.map(d=>(
                <button key={d.email} className="demo-btn" onClick={()=>{setEmail(d.email);setPw(d.pw);setErr("");}}>
                  <span className="role-name" style={{color:ROLE_AVATAR_COLOR[d.role]}}>{d.label}</span>
                  <span className="role-email">{d.email}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
        <div style={{marginTop:16,textAlign:'center',fontSize:10,color:'var(--muted)'}}>
          DisasterChain Testnet · Custom Blockchain Engine · No Hardhat Required
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// APP SHELL
// ═══════════════════════════════════════════════════
const NAV = {
  donor:     [{ id:"donate",   icon:"◈", label:"Donate" },     { id:"chain", icon:"≡", label:"Ledger" }],
  ngo:       [{ id:"shipments",icon:"▣", label:"Shipments" },  { id:"chain", icon:"≡", label:"Ledger" }],
  logistics: [{ id:"scan",     icon:"◉", label:"Scan" },       { id:"chain", icon:"≡", label:"Ledger" }],
  recipient: [{ id:"track",    icon:"◎", label:"Aid Portal" }, { id:"chain", icon:"≡", label:"Ledger" }],
};
const PAGE_TITLE = { donate:"Donations", shipments:"Shipment Management", scan:"Package Scanning", track:"Aid Recipient Portal", chain:"Blockchain Explorer" };

function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState(null);
  const [tick, setTick] = useState(0);

  const refresh = useCallback(()=>setTick(t=>t+1),[]);

  useEffect(()=>{
    if (!user) return;
    const interval = setInterval(refresh,5000);
    return ()=>clearInterval(interval);
  },[user]);

  const login = (u) => {
    setUser(u);
    setPage(NAV[u.role][0].id);
  };

  if (!user) return <Login onLogin={login}/>;

  const ac = ROLE_AVATAR_COLOR[user.role];

  const renderPage = () => {
    if (page === "chain") return <ChainPanel blocks={[...bc.chain]}/>;
    if (user.role==="donor")     return <DonorDash     user={user} tick={tick} onTick={refresh}/>;
    if (user.role==="ngo")       return <NGODash       user={user} tick={tick} onTick={refresh}/>;
    if (user.role==="logistics") return <LogisticsDash user={user} tick={tick} onTick={refresh}/>;
    if (user.role==="recipient") return <RecipientDash user={user} tick={tick} onTick={refresh}/>;
    return null;
  };

  return (
    <div className="app-wrap">
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1>Disaster<br/>Chain</h1>
          <div className="sub">Testnet v1</div>
        </div>

        <div className="sidebar-section">Navigation</div>
        {NAV[user.role].map(n=>(
          <div key={n.id} className={`nav-item ${page===n.id?"active":""}`} onClick={()=>setPage(n.id)}>
            <span className="icon">{n.icon}</span>
            <span className="label">{n.label}</span>
          </div>
        ))}

        <div style={{flex:1}}/>

        <div className="sidebar-section">Network</div>
        <div style={{padding:'0 16px 8px'}}>
          <div className="flex-center gap-8" style={{marginBottom:6}}>
            <div className="dot dot-green"/>
            <span className="text-xs text-muted">Chain live</span>
            <span className="text-xs text-muted" style={{marginLeft:'auto'}}>{bc.chain.length} blocks</span>
          </div>
          <div className="text-xs text-muted">Valid: <span style={{color:bc.valid()?"var(--green-lt)":"var(--red)"}}>{bc.valid()?"✓ Yes":"✗ Tampered"}</span></div>
        </div>

        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="avatar" style={{background:`${ac}22`,border:`1px solid ${ac}55`,color:ac}}>{user.avatar}</div>
            <div className="user-info">
              <div className="user-name">{user.name}</div>
              <div className="user-role">{user.role}</div>
            </div>
          </div>
          <button className="btn btn-ghost btn-full" style={{marginTop:8,fontSize:11}} onClick={()=>setUser(null)}>Sign out</button>
        </div>
      </aside>

      {/* Main */}
      <div className="main-area">
        <div className="topbar">
          <span style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:14,color:'var(--text)'}}>{PAGE_TITLE[page]||"Dashboard"}</span>
          <div style={{flex:1}}/>
          <div className="topbar-stat">Wallet <span className="mono" style={{fontSize:10}}>{user.wallet.slice(0,14)}…</span></div>
          {user.role==="donor" && <div className="topbar-stat">Balance <span>{DB.byId(user.id)?.eth} ETH</span></div>}
          <div className="topbar-stat">Blocks <span>{bc.chain.length}</span></div>
          <div className="chain-status">
            <div className="dot dot-green"/>
            <span>Live</span>
          </div>
        </div>
        <div className="content">
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
