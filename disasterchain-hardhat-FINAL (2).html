// ─────────────────────────────────────────────────────
// UID VERIFICATION MODAL
// ─────────────────────────────────────────────────────
function UIDVerifyModal({shipment, myRecord, onVerified, onClose}){
  const[uid,setUid]=useState("");
  const[err,setErr]=useState("");
  const[verifying,setVerifying]=useState(false);
  const[verified,setVerified]=useState(false);

  const normalizeUid=v=>v.replace(/\s/g,"");

  const handleInput=e=>{
    const raw=e.target.value.replace(/[^0-9]/g,"").slice(0,12);
    const spaced=raw.replace(/(\d{4})(\d{1,4})?(\d{1,4})?/,(_,a,b,c)=>[a,b,c].filter(Boolean).join(" "));
    setUid(spaced);
    setErr("");
  };

  const verify=async()=>{
    const entered=normalizeUid(uid);
    const expected=normalizeUid(myRecord.uid);
    if(entered.length<12){setErr("Please enter your full 12-digit UID.");return;}
    setVerifying(true);
    await new Promise(r=>setTimeout(r,900)); // brief "checking" animation
    if(entered!==expected){
      setErr("❌ UID does not match your KYC record. Please check and try again.");
      setVerifying(false);
      return;
    }
    setVerified(true);
    setVerifying(false);
    setTimeout(()=>onVerified(),700);
  };

  const overlayStyle={position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(4px)"};

  return(
    <div style={overlayStyle} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:2,width:"100%",maxWidth:420,overflow:"hidden",boxShadow:"0 24px 80px rgba(0,0,0,0.6)"}}>

        {/* Header */}
        <div style={{padding:"14px 18px",borderBottom:"1px solid var(--border)",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontFamily:"var(--font-head)",fontSize:14,fontWeight:700,color:"var(--text)"}}>🔐 Verify Your Identity</div>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>Enter your KYC UID to confirm receipt</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:18}}>✕</button>
        </div>

        <div style={{padding:20}}>
          {/* Shipment info */}
          <div style={{padding:"10px 12px",background:"#3a7bd511",border:"1px solid #3a7bd544",borderRadius:2,marginBottom:18,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:18,flexShrink:0}}>📦</div>
            <div>
              <div style={{fontSize:12,fontWeight:600,color:"#6fa8f5"}}>{shipment.description}</div>
              <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>SHIP-{shipment.id.toString()} · {shipment.recipientArea}</div>
            </div>
          </div>

          {/* UID input */}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:10,letterSpacing:"1.2px",textTransform:"uppercase",color:"var(--muted)",marginBottom:8}}>Your 12-Digit KYC UID</label>
            <input
              value={uid}
              onChange={handleInput}
              placeholder="XXXX XXXX XXXX"
              maxLength={14}
              style={{
                fontSize:20,fontWeight:700,letterSpacing:4,textAlign:"center",
                color:verified?"var(--green-lt)":err?"#e05a4e":"var(--amber)",
                border:`1px solid ${verified?"var(--green)":err?"#c0392b":"var(--border)"}`,
                transition:"border-color 0.2s, color 0.2s",
                padding:"14px",
              }}
              disabled={verifying||verified}
              autoFocus
            />
            <div style={{fontSize:10,color:"var(--muted)",marginTop:6,textAlign:"center"}}>
              Digits only · must match your registered KYC identity
            </div>
          </div>

          {/* Name hint from KYC */}
          <div style={{padding:"8px 12px",background:"#4a7c5911",border:"1px solid #4a7c5933",borderRadius:2,marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
            {myRecord.photoPreview&&<img src={myRecord.photoPreview} alt="photo" style={{width:28,height:34,objectFit:"cover",borderRadius:2,border:"1px solid var(--border)",flexShrink:0}}/>}
            <div>
              <div style={{fontSize:11,fontWeight:600,color:"var(--green-lt)"}}>{myRecord.fullName}</div>
              <div style={{fontSize:9,color:"var(--muted)",marginTop:2}}>📍 {myRecord.address.district}, {myRecord.address.state}</div>
            </div>
            <span className="tag tag-green" style={{marginLeft:"auto"}}>KYC ✓</span>
          </div>

          {/* Error */}
          {err&&<div style={{fontSize:11,color:"#e05a4e",padding:"8px 12px",background:"#c0392b11",border:"1px solid #c0392b44",borderRadius:2,marginBottom:12,lineHeight:1.6}}>{err}</div>}

          {/* Success flash */}
          {verified&&(
            <div style={{fontSize:12,color:"var(--green-lt)",padding:"10px 12px",background:"#4a7c5922",border:"1px solid #4a7c5999",borderRadius:2,marginBottom:12,textAlign:"center",fontWeight:600}}>
              ✓ Identity Verified — Submitting to blockchain…
              <div className="mining-bar" style={{marginTop:8}}/>
            </div>
          )}

          {/* Actions */}
          {!verified&&(
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={onClose} disabled={verifying}>Cancel</button>
              <button
                className="btn btn-blue"
                style={{flex:2,justifyContent:"center",fontSize:12}}
                onClick={verify}
                disabled={verifying||normalizeUid(uid).length<12}
              >
                {verifying?(
                  <span style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{width:10,height:10,border:"1.5px solid rgba(255,255,255,0.3)",borderTop:"1.5px solid #fff",borderRadius:"50%",display:"inline-block",animation:"spin 0.7s linear infinite"}}/>
                    Verifying…
                  </span>
                ):"Verify & Confirm Receipt"}
              </button>
            </div>
          )}

          <div style={{fontSize:9,color:"var(--border2)",marginTop:12,textAlign:"center",lineHeight:1.7}}>
            Your UID is verified locally before any blockchain transaction is made.<br/>
            Nothing is sent unless the UID matches your registered identity.
          </div>
        </div>
      </div>
    </div>
  );
}

function RecipientTrack({address,readContract,writeContract,myRecord}){
  const[ships,setShips]=useState([]);const[dons,setDons]=useState([]);
  const[scanMap,setScanMap]=useState({});const[loading,setLoad]=useState(false);
  const[claiming,setClaiming]=useState(null);
  const[uidModal,setUidModal]=useState(null); // shipment object or null

  const load=useCallback(async()=>{
    setLoad(true);
    try{
      const[a,b]=await Promise.all([readContract.getAllShipments(),readContract.getAllDonations()]);
      setShips(a);setDons(b);
      const sm={};
      for(const s of a){const ids=await readContract.getScansByShipment(s.id);const sc=[];for(const id of ids){sc.push(await readContract.scans(id));}sm[s.id.toString()]=sc;}
      setScanMap(sm);
    }catch(e){console.error(e.message);}
    setLoad(false);
  },[readContract]);
  useEffect(()=>{load();},[load]);

  const confirmReceipt=async(shipment)=>{
    setUidModal(shipment);
  };

  const executeClaimAid=async(shipId)=>{
    setUidModal(null);
    setClaiming(shipId);
    try {
      const tx = await writeContract.claimAid(BigInt(shipId), myRecord.uid);
      await tx.wait();
      alert(`✓ Receipt Confirmed on-chain!\n\nUID: ${myRecord.uid}\nName: ${myRecord.fullName}\nPackage: SHIP-${shipId}\nWallet: ${address}\n\nThis confirmation has been permanently recorded on the DisasterChain blockchain.`);
      load();
    } catch (e) {
      alert(e.reason || e.shortMessage || e.message || "Failed to claim aid");
    }
    setClaiming(null);
  };

  const totalEth=dons.reduce((s,d)=>s+parseFloat(fmtEth(d.amount)),0);

  return(
    <div>
      {uidModal&&myRecord&&(
        <UIDVerifyModal
          shipment={uidModal}
          myRecord={myRecord}
          onVerified={()=>executeClaimAid(uidModal.id.toString())}
          onClose={()=>setUidModal(null)}
        />
      )}
      {myRecord&&(
        <div style={{padding:'12px 16px',background:'#4a7c5911',border:'1px solid #4a7c5966',borderRadius:2,marginBottom:20,display:'flex',alignItems:'center',gap:14}}>
          {myRecord.photoPreview&&<img src={myRecord.photoPreview} alt="photo" style={{width:40,height:48,objectFit:'cover',borderRadius:2,border:'1px solid var(--border)',flexShrink:0}}/>}
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--green-lt)'}}>{myRecord.fullName}</div>
            <div className="text-xs text-muted mt-4">UID: <span style={{fontWeight:600,color:'var(--text)',letterSpacing:2}}>{myRecord.uid}</span></div>
            <div className="text-xs text-muted mt-4">📍 {myRecord.address.district}, {myRecord.address.state} — {myRecord.address.pincode}</div>
            <div className="text-xs text-muted mono mt-4">{fmtAddr(address)}</div>
          </div>
          <span className="tag tag-green">KYC Verified</span>
        </div>
      )}

      <div className="grid-3" style={{marginBottom:20}}>
        <div className="stat-block"><div className="stat-label">Aid Packages</div><div className="stat-value">{ships.length}</div></div>
        <div className="stat-block"><div className="stat-label">Delivered</div><div className="stat-value" style={{color:'var(--green-lt)'}}>{ships.filter(s=>Number(s.status)===5).length}</div></div>
        <div className="stat-block"><div className="stat-label">Total Aid Raised</div><div className="stat-value" style={{color:'var(--amber)'}}>{totalEth.toFixed(3)} ETH</div></div>
      </div>

      <div className="grid-main">
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Package Tracker</span><button className="btn btn-ghost" style={{padding:'4px 10px',fontSize:10}} onClick={load} disabled={loading}>{loading?"Loading...":"Refresh"}</button></div>
            <div className="panel-body">
              {ships.length===0?<div className="empty"><div className="empty-icon">◎</div>No packages yet</div>
              :ships.map(s=>{
                const scans=scanMap[s.id.toString()]||[];
                const delivered=Number(s.status)===5;
                const areaMatch=myRecord&&s.recipientArea.toLowerCase().includes(myRecord.address.district.toLowerCase());
                return(
                  <div key={s.id.toString()} style={{marginBottom:20,paddingBottom:20,borderBottom:'1px solid var(--border)'}}>
                    <div className="flex-between" style={{marginBottom:8}}>
                      <div><div style={{fontSize:13,fontWeight:700}}>{s.description}</div><div className="text-xs text-muted mt-4">{s.items}</div></div>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                        <span className={`tag ${STATUS_TAG[Number(s.status)]}`}>{STATUS_NAMES[Number(s.status)]}</span>
                        {areaMatch&&<span className="tag tag-green" style={{fontSize:9}}>Your Area</span>}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:8,marginBottom:8}}>
                      <span className="mono text-xs text-muted">SHIP-{s.id.toString()}</span>
                      <span className="text-xs text-muted">·</span>
                      <span className="text-xs text-muted">📍 {s.recipientArea}</span>
                    </div>
                    <div className="progress-wrap" style={{marginBottom:12}}><div className="progress-bar" style={{width:`${STATUS_PROG[Number(s.status)]}%`,background:STATUS_COL[Number(s.status)]}}/></div>

                    {delivered&&myRecord&&(
                      <div style={{padding:'10px 12px',background:'#3a7bd511',border:'1px solid #3a7bd566',borderRadius:2,marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                        <div>
                          <div style={{fontSize:11,fontWeight:600,color:'#6fa8f5'}}>Aid Available to Claim</div>
                          <div className="text-xs text-muted mt-4">UID {myRecord.uid} · {myRecord.fullName}</div>
                        </div>
                        <button className="btn btn-blue" style={{fontSize:11,padding:'7px 14px'}} onClick={()=>confirmReceipt(s)} disabled={claiming===s.id.toString()}>
                          {claiming===s.id.toString()?"Confirming...":"Confirm Receipt"}
                        </button>
                      </div>
                    )}
                    {delivered&&!myRecord&&(
                      <div style={{padding:'8px 12px',background:'#7a3f0d11',border:'1px solid #7a3f0d44',borderRadius:2,marginBottom:12,fontSize:11,color:'var(--amber)'}}>
                        Complete KYC registration to claim this aid package
                      </div>
                    )}

                    {scans.length>0?(
                      <div>
                        <div style={{fontSize:10,color:'var(--muted)',letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:10}}>Verified Checkpoints</div>
                        {scans.map((sc,i)=>(
                          <div key={i} className="timeline-item">
                            <div className="timeline-dot-wrap">
                              <div className="tl-dot" style={{borderColor:STATUS_COL[Number(sc.status)],background:i===scans.length-1?STATUS_COL[Number(sc.status)]:'transparent'}}/>
                              {i<scans.length-1&&<div className="tl-line"/>}
                            </div>
                            <div className="tl-content">
                              <div className="tl-loc">📍 {sc.location}</div>
                              <div className="tl-meta">{fmtTime(sc.timestamp)} · {STATUS_NAMES[Number(sc.status)]}</div>
                              <div className="tl-meta">{sc.gpsCoords}</div>
                              <div className="tl-tx">agent: {fmtAddr(sc.agent)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    ):<div className="text-xs text-muted" style={{fontStyle:'italic'}}>Awaiting first logistics checkpoint...</div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">All Donors</span></div>
            <div className="panel-body" style={{padding:'0 16px'}}>
              {dons.length===0?<div className="empty"><div className="empty-icon">◎</div>No donations yet</div>
              :dons.map(d=>(
                <div key={d.id.toString()} className="data-row">
                  <div style={{paddingTop:3}}><div className="dot dot-green"/></div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="flex-between"><span style={{fontSize:13,fontWeight:600}}>{d.donorName}</span><span className="text-amber fw-700" style={{fontSize:14}}>{fmtEth(d.amount)} ETH</span></div>
                    <div className="text-xs text-muted mt-4">{d.disasterType} · {fmtTime(d.timestamp)}</div>
                    <div className="text-xs text-muted mono mt-4">{fmtAddr(d.donor)}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <EventsPanel readContract={readContract}/>
        </div>
      </div>
    </div>
  );
}

function PublicLedger({wallet}){
  const{readContract}=wallet;
  const[dons,setDons]=useState([]);
  const[ships,setShips]=useState([]);
  const[scans,setScans]=useState({});
  const[blocks,setBlocks]=useState([]);
  const[loading,setLoad]=useState(false);
  const[selectedBlock,setSelectedBlock]=useState(null);

  const load=useCallback(async()=>{
    setLoad(true);
    try{
      const[a,b]=await Promise.all([readContract.getAllDonations(),readContract.getAllShipments()]);
      setDons(a);setShips(b);
      const sm={};
      for(const s of b){const ids=await readContract.getScansByShipment(s.id);const sc=[];for(const id of ids){sc.push(await readContract.scans(id));}sm[s.id.toString()]=sc;}
      setScans(sm);

      // Fetch Latest Blocks
      const currentBlockNumber = await wallet.rpcProvider.getBlockNumber();
      const latestBlocks = [];
      const blocksToFetch = Math.min(10, currentBlockNumber + 1); // Get up to 10 latest blocks
      for(let i = 0; i < blocksToFetch; i++) {
        const blk = await wallet.rpcProvider.getBlock(currentBlockNumber - i);
        if(blk) latestBlocks.push(blk);
      }
      setBlocks(latestBlocks);
    }catch(e){console.error(e.message);}
    setLoad(false);
  },[readContract, wallet.rpcProvider]);
  useEffect(()=>{load();},[load]);

  const totalEth=dons.reduce((s,d)=>s+parseFloat(fmtEth(d.amount)),0);

  return(
    <div>
      <div className="grid-3" style={{marginBottom:20}}>
        <div className="stat-block"><div className="stat-label">Total Volume</div><div className="stat-value" style={{color:'var(--amber)'}}>{totalEth.toFixed(3)} ETH</div></div>
        <div className="stat-block"><div className="stat-label">Total Donations</div><div className="stat-value">{dons.length}</div></div>
        <div className="stat-block"><div className="stat-label">Current Block</div><div className="stat-value">{blocks.length>0?blocks[0].number:'...'}</div></div>
      </div>
      <div className="grid-main">
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Raw Blockchain Explorer</span><button className="btn btn-ghost" style={{padding:'4px 10px',fontSize:10}} onClick={load} disabled={loading}>Refresh</button></div>
            <div className="panel-body" style={{padding:'0 16px'}}>
              {blocks.length===0?<div className="empty"><div className="empty-icon">◎</div>No blocks found</div>
              :blocks.map(b=>(
                <div key={b.number} className="data-row" style={{flexDirection:'column',gap:8,cursor:'pointer',transition:'background 0.2s'}} onClick={()=>setSelectedBlock(b)} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <div className="flex-between w-full">
                    <span className="mono" style={{fontSize:13,color:'var(--amber)',fontWeight:700}}>Block #{b.number}</span>
                    <span className="tag tag-muted">{b.transactions.length} TXs</span>
                  </div>
                  <div className="text-xs text-muted mono">Hash: {fmtAddr(b.hash)}...{b.hash.slice(-6)}</div>
                  <div className="text-xs text-muted mono">Parent: {fmtAddr(b.parentHash)}...{b.parentHash.slice(-6)}</div>
                  <div className="text-xs text-muted">Mined: {new Date(b.timestamp*1000).toLocaleString('en-IN')}</div>
                </div>
              ))}
            </div>
            {selectedBlock && (
              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={(e)=>{if(e.target===e.currentTarget)setSelectedBlock(null)}}>
                <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:2,width:"100%",maxWidth:540,maxHeight:"90vh",overflowY:"auto"}}>
                  <div style={{padding:"14px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg)",position:"sticky",top:0}}>
                    <div>
                      <div style={{fontFamily:"var(--font-head)",fontSize:16,fontWeight:700,color:"var(--amber)"}}>Block #{selectedBlock.number}</div>
                      <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>Hardhat Local Network</div>
                    </div>
                    <button onClick={()=>setSelectedBlock(null)} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:18}}>✕</button>
                  </div>
                  <div style={{padding:20,display:'flex',flexDirection:'column',gap:14}}>
                    <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Block Hash</div><div className="stat-value mono" style={{fontSize:11,wordBreak:'break-all',color:'var(--text)'}}>{selectedBlock.hash}</div></div>
                    <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Parent Hash</div><div className="stat-value mono" style={{fontSize:11,wordBreak:'break-all',color:'var(--text)'}}>{selectedBlock.parentHash}</div></div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Timestamp</div><div className="stat-value" style={{fontSize:13}}>{new Date(selectedBlock.timestamp*1000).toLocaleString('en-IN')}</div></div>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Transactions</div><div className="stat-value" style={{fontSize:13}}>{selectedBlock.transactions.length}</div></div>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Nonce</div><div className="stat-value mono" style={{fontSize:13}}>{selectedBlock.nonce}</div></div>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Miner</div><div className="stat-value mono" style={{fontSize:11,wordBreak:'break-all'}}>{selectedBlock.miner}</div></div>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Gas Used / Limit</div><div className="stat-value mono" style={{fontSize:13}}>{selectedBlock.gasUsed?.toString()} / {selectedBlock.gasLimit?.toString()}</div></div>
                      <div className="stat-block" style={{background:'var(--bg)',padding:12}}><div className="stat-label">Base Fee (Gwei)</div><div className="stat-value mono" style={{fontSize:13}}>{selectedBlock.baseFeePerGas ? ethers.formatUnits(selectedBlock.baseFeePerGas, 'gwei') : 'N/A'}</div></div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Global Shipments Ledger</span></div>
            <div className="panel-body">
              {ships.length===0?<div className="empty"><div className="empty-icon">◎</div>No shipments recorded</div>
              :[...ships].reverse().map(s=>(
                <div key={s.id.toString()} style={{marginBottom:20,paddingBottom:20,borderBottom:'1px solid var(--border)'}}>
                  <div className="flex-between" style={{marginBottom:8}}>
                    <div><div style={{fontSize:13,fontWeight:700}}>{s.description}</div><div className="text-xs text-muted mt-4">By: {s.ngoName} ({fmtAddr(s.ngo)})</div></div>
                    <span className={`tag ${STATUS_TAG[Number(s.status)]}`}>{STATUS_NAMES[Number(s.status)]}</span>
                  </div>
                  <div style={{display:'flex',gap:8,marginBottom:8}}>
                    <span className="mono text-xs text-muted">SHIP-{s.id.toString()}</span><span className="text-xs text-muted">·</span><span className="text-xs text-muted">📍 {s.recipientArea}</span>
                  </div>
                  <div className="progress-wrap" style={{marginBottom:12}}><div className="progress-bar" style={{width:`${STATUS_PROG[Number(s.status)]}%`,background:STATUS_COL[Number(s.status)]}}/></div>
                </div>
              ))}
            </div>
          </div>
          <div className="panel">
            <div className="panel-header"><span className="panel-title">Global Donations Ledger</span></div>
          <div className="panel-body" style={{padding:'0 16px'}}>
            {dons.length===0?<div className="empty"><div className="empty-icon">◎</div>No donations recorded</div>
            :[...dons].reverse().map(d=>(
              <div key={d.id.toString()} className="data-row">
                <div style={{paddingTop:3}}><div className="dot dot-amber"/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="flex-between"><span style={{fontSize:13,fontWeight:600}}>{d.disasterType}</span><span className="text-amber fw-700" style={{fontSize:14}}>{fmtEth(d.amount)} ETH</span></div>
                  <div className="text-xs text-muted mt-4">{d.donorName} ({fmtAddr(d.donor)})</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        </div>
      </div>
    </div>
  );
}


// ─────────────────────────────────────────────────────
// APP SHELL
// ─────────────────────────────────────────────────────
const NAV={
  donor:    [{id:"donate",    icon:"◈",label:"Donate"},{id:"ledger",icon:"🗃️",label:"Public Ledger"}],
  ngo:      [{id:"shipments", icon:"▣",label:"Shipments"},{id:"ledger",icon:"🗃️",label:"Public Ledger"}],
  logistics:[{id:"scan",      icon:"◉",label:"Scan"},{id:"ledger",icon:"🗃️",label:"Public Ledger"}],
  recipient:[{id:"recipient", icon:"🔐",label:"My Aid Portal"},{id:"ledger",icon:"🗃️",label:"Public Ledger"}],
};
const PAGE_TITLE={donate:"Donations",shipments:"Shipment Management",scan:"Package Scanning",recipient:"Aid Recipient Portal",ledger:"Public Blockchain Ledger"};

function App(){
  const[wallet,setWallet]=useState(null);
  const[page,setPage]=useState(null);
  const[tick,setTick]=useState(0);
  const refresh=useCallback(()=>setTick(t=>t+1),[]);

  if(!wallet)return <ConnectScreen onConnected={w=>{setWallet(w);setPage(NAV[w.role][0].id);}}/>;

  const{role,address,network,balance}=wallet;
  const ac=ROLE_AC[role];

  const renderPage=()=>{
    if(page==="ledger")    return <PublicLedger  wallet={wallet}/>;
    if(role==="donor")     return <DonorDash     wallet={wallet} onTick={refresh}/>;
    if(role==="ngo")       return <NGODash       wallet={wallet} onTick={refresh}/>;
    if(role==="logistics") return <LogisticsDash wallet={wallet} onTick={refresh}/>;
    if(role==="recipient") return <RecipientDash wallet={wallet}/>;
  };

  return(
    <div className="app-wrap">
      <aside className="sidebar">
        <div className="sidebar-logo"><h1>Disaster<br/>Chain</h1><div className="sub">Hardhat · Solidity</div></div>
        <div className="sidebar-section">Navigation</div>
        {NAV[role].map(n=>(
          <div key={n.id} className={`nav-item ${page===n.id?"active":""}`} onClick={()=>setPage(n.id)}>
            <span className="icon">{n.icon}</span><span className="label">{n.label}</span>
          </div>
        ))}
        <div style={{flex:1}}/>
        <div className="sidebar-section">Network</div>
        <div style={{padding:'0 16px 8px'}}>
          <div className="flex-center gap-8" style={{marginBottom:4}}><div className="dot dot-green"/><span className="text-xs text-muted">{network.name}</span></div>
          <div className="text-xs text-muted">Chain ID: {Number(network.chainId)}</div>
          <div className="text-xs text-muted mono" style={{marginTop:4,wordBreak:'break-all'}}>
            {CONTRACT_ADDRESS!=="PASTE_CONTRACT_ADDRESS_HERE"?fmtAddr(CONTRACT_ADDRESS):<span style={{color:'var(--red)'}}>not set</span>}
          </div>
        </div>
        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="avatar" style={{background:`${ac}22`,border:`1px solid ${ac}55`,color:ac}}>{address.slice(2,4).toUpperCase()}</div>
            <div className="user-info"><div className="user-name mono">{fmtAddr(address)}</div><div className="user-role">{role}</div></div>
          </div>
          <button className="btn btn-ghost btn-full" style={{marginTop:8,fontSize:11}} onClick={()=>setWallet(null)}>Disconnect</button>
        </div>
      </aside>
      <div className="main-area">
        <div className="topbar">
          <span style={{fontFamily:'var(--font-head)',fontWeight:700,fontSize:14,color:'var(--text)'}}>{PAGE_TITLE[page]||"Dashboard"}</span>
          <div style={{flex:1}}/>
          <div className="topbar-stat">Wallet <span className="mono" style={{fontSize:10}}>{fmtAddr(address)}</span></div>
          {role==="donor"&&<div className="topbar-stat">Balance <span>{fmtEth(balance)} ETH</span></div>}
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:10,color:'var(--muted)'}}><div className="dot dot-green"/><span>Live</span></div>
        </div>
        <div className="content">{renderPage()}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
